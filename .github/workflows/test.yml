name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    # the storage tests run a second time against this server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # clonim revision providing the language features nitomic uses
      CLONIM_REF: main
    steps:
      - uses: actions/checkout@v4

      - name: Check out clonim
        uses: actions/checkout@v4
        with:
          repository: codegod100/clonim
          ref: ${{ env.CLONIM_REF }}
          path: clonim

      - name: Install Nim
        run: |
          curl --fail --show-error --silent \
            https://nim-lang.org/choosenim/init.sh -o /tmp/choosenim-init.sh
          CHOOSENIM_CHOOSE_VERSION=2.2.12 sh /tmp/choosenim-init.sh -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpcre3 libsqlite3-0 libpq5

      - name: Build clonim
        run: |
          cd clonim
          nim c --hints:off --warnings:off -o:bin/clonim src/clonim.nim

      - name: Run tests
        run: CLONIM=$PWD/clonim/bin/clonim test/run.sh

      - name: Run tests with PostgreSQL storage
        env:
          NITOMIC_TEST_STORAGE: jdbc:postgresql://localhost:5432/postgres?user=postgres&password=postgres
        run: CLONIM=$PWD/clonim/bin/clonim test/run.sh
